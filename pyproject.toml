[project]
name = "data-migration-poc"
version = "0.1.0"
description = "Migrate historical CSV data to a SQL database, ingest new records through a REST API, and back up and restore tables in AVRO format."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = []
